name: Build Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > signingkey.jks

      - name: Auto-fix code formatting
        run: ./gradlew spotlessApply

      - name: Find extension modules
        id: modules
        run: |
          MODULES=$(find src -mindepth 3 -maxdepth 3 -name build.gradle.kts -exec dirname {} \; | sed 's#/#:#g' | sed 's/^/:/' | tr '\n' ' ')
          echo "Modul ditemukan: $MODULES"
          echo "list=$MODULES" >> "$GITHUB_OUTPUT"

      - name: Build extensions
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TASKS=""
          for m in ${{ steps.modules.outputs.list }}; do
            TASKS="$TASKS ${m}:assembleRelease"
          done
          echo "Menjalankan: ./gradlew $TASKS"
          ./gradlew $TASKS

      - name: Clean up signing key
        if: always()
        run: rm -f signingkey.jks

      - name: Show build results
        run: |
          echo "=== File APK yang dihasilkan ==="
          find . -name "*.apk" -path "*release*" || echo "(tidak ada APK ketemu)"
          echo ""
          echo "=== File metadata source, kalau ada ==="
          find . -iname "*source-info*.json" -exec sh -c 'echo "--- {} ---"; cat "{}"; echo' \; || echo "(tidak ada file source-info ketemu)"

      - name: Generate index.json and publish
        run: |
          python3 << 'PYEOF'
          import json, glob, os, shutil

          extensions = []
          for info_path in glob.glob("**/build/keiyoushi-source-info.json", recursive=True):
              with open(info_path) as f:
                  info = json.load(f)
              module_dir = info_path.split("/build/")[0]
              apk_matches = glob.glob(f"{module_dir}/build/outputs/apk/release/*.apk")
              if not apk_matches:
                  continue
              apk_path = apk_matches[0]
              apk_name = os.path.basename(apk_path)
              shutil.copy(apk_path, apk_name)

              extensions.append({
                  "name": info["name"],
                  "pkg": info["packageName"],
                  "apk": apk_name,
                  "lang": info["sources"][0]["lang"] if info["sources"] else "all",
                  "code": info["versionCode"],
                  "version": info["versionName"],
                  "nsfw": 1 if info.get("contentWarning", 0) != 0 else 0,
                  "sources": [
                      {
                          "name": s["name"],
                          "lang": s["lang"],
                          "id": str(s["id"]),
                          "baseUrl": s["baseUrl"],
                      }
                      for s in info["sources"]
                  ],
              })

          with open("index.json", "w") as f:
              json.dump(extensions, f, indent=2)
          print(json.dumps(extensions, indent=2))
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json *.apk
          git diff --staged --quiet && echo "Tidak ada perubahan" || git commit -m "Publish extension build [skip ci]"
          git diff --staged --quiet || git push

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            **/build/outputs/apk/release/*.apk
            **/*source-info*.json
          retention-days: 14
          if-no-files-found: warn
